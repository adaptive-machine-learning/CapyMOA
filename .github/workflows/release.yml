# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

# TODO: In the future we ought to perform linting and code coverage checks

name: Release

on:
  workflow_dispatch:

jobs:
  test:
    name: Tests
    timeout-minutes: 120
    runs-on: ${{ matrix.operating-system }}
    env:
      # Windows/macOS runners are noticeably slower than the Linux runner the
      # pytest/doctest/notebook timeouts in tasks.py are tuned for. Double
      # them here rather than loosening the timeouts everyone else runs with.
      PYTEST_TIMEOUT_FACTOR: "2"
    strategy:
      fail-fast: true
      matrix:
        # Python 3.11->3.13 on Ubuntu, Windows and MacOS
        operating-system: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v3
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra torch-cpu

      - name: PyTest
        # torch-cpu is installed above, so this runs the whole suite,
        # torch-marked tests included -- no -m filter needed.
        run: uv run invoke test.pytest

      - name: Doctest
        run: uv run invoke test.doctest

      - name: Notebooks
        run: uv run invoke test.nb

  documentation:
    name: Documentation
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.11"
    - name: Install Dependencies
      run: |
        sudo apt-get install -y pandoc
        uv sync --extra dev --extra doc --extra torch-cpu
    - name: Build Documentation
      run: uv run invoke docs.build
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: docs-build
        path: docs/_build

  release_pypi:
    name: Release / PyPi
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: release
    needs: [test, documentation]
    permissions:
      id-token: write
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
    
      - name: Install Hatch
        run: python3 -m pip install hatch~=1.9.7

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.4.1
        with:
            github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Package
        if: steps.release.outputs.released == 'true'
        run: python3 -m hatch build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.release.outputs.released == 'true'

      - name: Publish package distributions to GitHub Releases
        uses: python-semantic-release/upload-to-gh-release@0f96c02a48278aff14251e9f1a0d73122a8c638b
        if: steps.release.outputs.released == 'true'
        with:
            github_token: ${{ secrets.GITHUB_TOKEN }}

  # Packages this release's built docs and attaches them to the GitHub Release as a
  # download-able asset. This is the only place a version's docs are stored, so this
  # job must run before `website`, which reconstructs the full versioned site by
  # downloading every past release's docs asset.
  publish_docs_asset:
    name: Publish Docs Asset
    if: needs.release_pypi.outputs.released == 'true'
    runs-on: ubuntu-latest
    needs: [documentation, release_pypi]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs/_build

      - name: Package documentation
        run: tar -czf "docs-${{ needs.release_pypi.outputs.tag }}.tar.gz" -C docs/_build .

      - name: Attach docs package to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "${{ needs.release_pypi.outputs.tag }}"
          "docs-${{ needs.release_pypi.outputs.tag }}.tar.gz"
          --repo "$GITHUB_REPOSITORY"

  release_docker:
    name: Release / Docker
    environment: release
    runs-on: ubuntu-latest
    needs: [release_pypi]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          file: docker/dockerfile
          tags: >-
            ${{ secrets.DOCKERHUB_USERNAME }}/jupyter-capymoa:${{ needs.release_pypi.outputs.tag }},
            ${{ secrets.DOCKERHUB_USERNAME }}/jupyter-capymoa:latest
          build-args: CAPYMOA_VERSION=${{ needs.release_pypi.outputs.tag }}

  # Rebuilds the full versioned site from scratch on every release. GitHub Releases is
  # the only source of truth for "which versions have docs" (no gh-pages branch, no
  # separate versions file to go stale). Every release with a docs-*.tar.gz asset is
  # downloaded and extracted into its own /vX.Y.Z/ folder, the newest is also copied to
  # the site root, and the result is deployed via the same upload-pages-artifact /
  # deploy-pages actions used before this change.
  website:
    name: Website
    if: needs.release_pypi.outputs.released == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    # Must run after publish_docs_asset: the current release's docs asset needs to
    # already be attached before we enumerate "every release with a docs asset" below.
    needs: [release_pypi, publish_docs_asset]
    steps:
      - uses: actions/checkout@v4

      - name: List released doc versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 docs/release_scripts.py list-versions \
            --repo "$GITHUB_REPOSITORY" --keep-current-line 5 --output tags.txt
          cat tags.txt

      - name: Download and assemble versioned docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 docs/release_scripts.py assemble \
            --repo "$GITHUB_REPOSITORY" --tags-file tags.txt --publish-dir publish

      - name: Generate switcher.json
        run: |
          python3 docs/release_scripts.py build-switcher \
            --tags-file tags.txt --output publish/switcher.json
          cat publish/switcher.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
