{# Links to the Markdown version of this page generated by sphinx_llm.txt,
   and a button that copies that Markdown to the clipboard. Both are handy
   for pasting a page into an LLM chat or letting an agent fetch it. #}
<div class="tocsection llm-page-actions">
  <a href="{{ pathto(pagename + '.md', 1) }}">
    <i class="fa-solid fa-file-lines"></i> {{ _("View as Markdown") }}
  </a>
</div>
<div class="tocsection llm-page-actions">
  <button
    type="button"
    class="llm-copy-page-button"
    data-markdown-href="{{ pathto(pagename + '.md', 1) }}"
  >
    <i class="fa-regular fa-copy"></i>
    <span class="llm-copy-page-button__label">{{ _("Copy page") }}</span>
  </button>
</div>
