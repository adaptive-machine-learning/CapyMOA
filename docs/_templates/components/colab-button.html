{# "Open in Colab" and download links, set by add_colab_url in docs/conf.py on notebook pages. #}
{% if colab_url %}
<div class="tocsection colab-button">
  <a href="{{ colab_url }}" target="_blank" rel="noopener">
    <i class="fa-solid fa-flask"></i> {{ _("Open in Colab") }}
  </a>
</div>
{% endif %}
{% if notebook_download %}
<div class="tocsection colab-button">
  <a href="{{ pathto(pagename + '.ipynb', 1) }}" download>
    <i class="fa-solid fa-download"></i> {{ _("Download notebook") }}
  </a>
</div>
{% endif %}
