  params: {}

  accuracy: 90.55
  win_accuracy: 89.0
  # TODO: This issue must be fixed in MOA. It cannot be fixed in Python.
  skip_test_save_then_load: "The MOA inner class
    StreamingRandomPatches$StreamingRandomPatchesClassifier does not implement
    java.io.Serializable. As a result, save_model()/load_model() fails with
    NotSerializableException. The class must implement Serializable, then the jar must
    be rebuilt."

