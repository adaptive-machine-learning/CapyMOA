  always_deterministic: true

- id: SAMkNN
  learner: capymoa.classifier.SAMkNN
  params: {}

  accuracy: 82.65
  win_accuracy: 82.0
  # Deterministic: nearest-neighbour search uses no randomness.
  always_deterministic: true
  # TODO: This issue is in the MOA SAMkNN implementation.
  skip_test_predict: "Repeated calls to SAMkNN predict()/predict_proba()
    without a train() call can return different results. On the same
    untrained instance, predict() returns a class, predict_proba() returns
    None, and a third call also returns None. The MOA
    getVotesForInstance() call may change internal state."
  skip_test_optimise: "SAMkNN's fast (optimise=True) and slow
    (optimise=False) loops give different accuracy: 82.65% and 82.5% on
    ElectricityTiny. This may have the same cause as the state change
    described in skip_test_predict."

- id: DynamicWeightedMajority
  learner: capymoa.classifier.DynamicWeightedMajority
  params: {}

  accuracy: 84.05
  win_accuracy: 89.0
  always_deterministic: true

  # NOTE: Defaulting to 0 before training is arguably wrong, but it's legacy MOA behaviour.
  predicts_before_training: "DynamicWeightedMajority has a default prediction of 0."

- id: CSMOTE
  learner: capymoa.classifier.CSMOTE
  params: {}

  accuracy: 80.75
  win_accuracy: 64.0
  # TODO: MOA bug, not fixable from Python. Same-seed CSMOTE instances diverge
  # once oversampling starts, but only when trained concurrently in one JVM
  # (as in test_determinism), not when trained one after another. Likely
  # shared state in MOA's CSMOTE code.
  skip_test_determinism: "CSMOTE instances with the same random_seed
    diverge after SMOTE starts when multiple instances are trained at the same time in
    one JVM. This needs work in the MOA CSMOTE code."

