  params: {}

  accuracy: 89.15
  win_accuracy: 78.0
  # Trains via per-instance SGD; sub-ULP FP differences across platforms can
  # compound and flip a prediction, shifting accuracy slightly.
  accuracy_abs_tolerance: 1.0

- id: Finetune
  learner: capymoa.classifier.Finetune
  params:
    model: Perceptron
    optimizer: Adam
    optimizer_params:
      lr: 0.01

  needs_torch: true
  # A randomly-initialised NN's forward pass is a genuine prediction, not an abstention.
  predicts_before_training: true
  batch_size: 32

  accuracy: 57.4
  win_accuracy: 66.0

